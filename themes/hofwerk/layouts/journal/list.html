{{ define "main" }}
<h2>{{ .Title }}</h2>
{{ .Content }}
{{ range .Pages.ByDate.Reverse }}
<article style="margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border);">
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  {{ with .Params.summary }}<p class="text-muted">{{ . }}</p>{{ end }}
</article>
{{ end }}
{{ end }}
